name: countdowns
description: Create and customize live countdowns to your events.

publish_to: 'none'

version: 2.0.0+5

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter

  auto_size_text: ^3.0.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  url_launcher: ^6.0.17
  go_router: ^18.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  flutter_animate: ^4.2.0+1
  flex_color_picker: ^4.0.0
  in_app_review: ^2.0.6
  flutter_local_notifications: ^23.0.3
  permission_handler: ^13.0.2
  audioplayers: ^6.1.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.2
  flutter_riverpod: ^3.5.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_dynamic_icon_plus: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
    - assets/images/icons/

  fonts:
    - family: ComicNeue
      fonts:
        - asset: fonts/ComicNeue-Regular.ttf
          weight: 400
        - asset: fonts/ComicNeue-Light.ttf
          weight: 300
        - asset: fonts/ComicNeue-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Light.ttf
          weight: 300
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: LibreBaskerville
      fonts:
        - asset: fonts/LibreBaskerville-Regular.ttf
          weight: 400
        - asset: fonts/LibreBaskerville-Italic.ttf
          weight: 300
        - asset: fonts/LibreBaskerville-Bold.ttf
          weight: 700
    - family: CarnivaleeFreakshow
      fonts:
        - asset: fonts/CarnivaleeFreakshow-Regular.ttf
          weight: 400
    - family: GoodTimes
      fonts:
        - asset: fonts/GoodTimes-Regular.otf
          weight: 400
    - family: LuxuriousRoman
      fonts:
        - asset: fonts/LuxuriousRoman-Regular.ttf
          weight: 400
    - family: Starjedi
      fonts:
        - asset: fonts/Starjedi.ttf
          weight: 400
    - family: Sunnyspells
      fonts:
        - asset: fonts/Sunnyspells.otf
          weight: 400
    - family: NewWaltDisney
      fonts:
        - asset: fonts/NewWaltDisney.ttf
          weight: 400
    - family: DiarioDeAndy
      fonts:
        - asset: fonts/DiarioDeAndy.otf
          weight: 400
