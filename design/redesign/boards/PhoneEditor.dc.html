        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Font</h2><button onClick="{{openSheet}}" style="border: none; background: none; padding: 0; font-size: 13px; font-weight: 700; color: #4A0D67">All 11 fonts</button></div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">

    <section aria-label="All fonts" style="position: absolute; left: 0; right: 0; bottom: 0; height: 720px; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 10px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 40px rgba(28,22,51,0.25)">

      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">All fonts</h2>
        <button onClick="{{closeSheet}}" style="height: 40px; padding: 0 18px; border-radius: 20px; border: none; background: #1C1633; color: #FFFFFF; font-weight: 700; font-size: 15px">Done</button>
      </div>
      <div role="group" aria-label="Filter fonts" style="display: flex; gap: 6px; background: #F5F4FF; border-radius: 22px; padding: 4px">

          <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex: 1; height: 36px; border: none; border-radius: 18px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 700">{{t.label}}</button>
        </sc-for>
      </div>
      <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px; min-height: 0">
        <sc-for list="{{rows}}" as="f" hint-placeholder-count="11">
          <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex-shrink: 0; height: 60px; border-radius: 18px; border: 2px solid {{f.border}}; background: #F5F4FF; color: #1C1633; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left">
            <span style="flex: 1; font-family: {{f.family}}; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Japan trip</span>
            <span style="font-size: 12px; font-weight: 600; color: #5E5878">{{f.name}}</span>
            <span style="width: 24px; height: 24px; border-radius: 12px; background: {{f.check}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"part":{"editor":"enum","options":["Details","Look"],"default":"Details"},"sheet":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { part: p.part || 'Details', bg: 'Sky', icon: 'plane', font: 'Default', sheet: !!p.sheet, tab: 'All', unit: 'Days', rem: ['On the day', '1 week before'], recent: ['Default', 'Baskerville', 'Comic Neue', 'Not Disney'] }; }
  renderVals() {
    const C = [['Lavender','#7877E6'],['Charcoal','#8A8796'],['Sun','#F7BC33'],['Tomato','#FF564A'],['Peach','#FEA08B'],['Tangerine','#FE7228'],['Lime','#83C236'],['Cobalt','#597FFE'],['Sky','#66B6FE'],['Bubblegum','#FE607C'],['Mint','#5FD3B5'],['Lilac','#C9A7F5']];

    const PH = { fuji: '/_blob/936f0c7563d452e48e8a01312dd864ba', beach: '/_blob/176363716b4c903c7c79827e2038e0ec' };

      gift: 'M4 8h16v4H4zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5',
      cake: 'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3',

      cap: 'M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',
      home: 'M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      dining: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7',
      ring: 'M8 8l4-5 4 5M12 21a6 6 0 1 0 0-12 6 6 0 0 0 0 12z',
      baby: 'M9 12h.01M15 12h.01M10 16c1 .7 3 .7 4 0M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3c-1 2 0 3 2 3',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',

      paw: 'M12 21c-3 0-6-2-6-5s3-5 6-5 6 2 6 5-3 5-6 5zM5 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM15 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'
    };
    const F = [['Default', "'Bricolage Grotesque', sans-serif", 'Clean'], ['Roboto', 'Roboto, sans-serif', 'Clean'], ['Good Times', "'GoodTimes', sans-serif", 'Clean'], ['Baskerville', "'Libre Baskerville', serif", 'Classic'], ['Luxurious Roman', "'Luxurious Roman', serif", 'Classic'], ['Comic Neue', "'Comic Neue', cursive", 'Fun'], ['Diario De Andy', "'DiarioDeAndy', cursive", 'Fun'], ['Sunnyspells', "'Sunnyspells', cursive", 'Fun'], ['Carnivalee Freakshow', "'CarnivaleeFreakshow', fantasy", 'Fun'], ['Not Starwars', "'Starjedi', fantasy", 'Fun'], ['Not Disney', "'NewWaltDisney', fantasy", 'Fun']];

    return {

      big: String(UV[s.unit][0]), unitWord: UV[s.unit][1],

  }
}
