<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crop photo, iPad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0D67}a:hover{color:#1C1633}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; position: relative; overflow: hidden; background: #120F22; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
  <header style="position: absolute; left: 0; right: 0; top: 0; height: 80px; padding: 24px 28px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="TabletLook.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 600; font-size: 16px; color: #B3B2F7; text-decoration: none">Cancel</a>
    <span style="font-weight: 700; font-size: 18px">Crop photo</span>
    <a href="TabletLook.dc.html" style="height: 42px; padding: 0 22px; border-radius: 21px; background: #F7BC33; color: #1C1633; text-decoration: none; display: flex; align-items: center; font-weight: 700; font-size: 15px">Done</a>
  </header>

  <div style="position: absolute; left: 28px; top: 100px; width: 525px; height: 700px; border-radius: 18px; overflow: hidden; background: url(/_blob/936f0c7563d452e48e8a01312dd864ba) center/cover">
    <sc-for list="{{frames}}" as="f" hint-placeholder-count="4">
      <div style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: {{f.w}}px; height: {{f.h}}px; box-sizing: border-box; border: {{f.border}}; border-radius: {{f.radius}}; box-shadow: {{f.mask}}; opacity: {{f.op}}">
        <span style="position: absolute; left: 8px; top: 8px; height: 24px; padding: 0 9px; border-radius: 12px; background: {{f.color}}; color: #1C1633; font-size: 12px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{f.label}}</span>
      </div>
    </sc-for>
    <span style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(18,15,34,0.7); font-size: 13px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{hint}}</span>
  </div>

  <aside style="position: absolute; left: 585px; right: 28px; top: 100px; bottom: 34px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Every place it shows up</h2><span style="font-size: 14px; color: #B9B5D6">Pick a shape to set its own crop, or see them all at once.</span></div>
    <button onClick="{{showAll}}" aria-pressed="{{allOn}}" style="height: 44px; border-radius: 14px; border: 2px solid {{allRing}}; background: rgba(255,255,255,0.06); color: #FFFFFF; font-size: 14px; font-weight: 700">Show all outlines</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="height: 150px; border-radius: 18px; border: 2px solid {{r.ring}}; background: {{r.bg}}; color: #FFFFFF; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left">
          <span style="width: {{r.mw}}px; height: 84px; border-radius: {{r.mr}}; background: url(/_blob/936f0c7563d452e48e8a01312dd864ba) {{r.px}}px {{r.py}}px / {{r.bw}}px {{r.bh}}px no-repeat; box-shadow: 0 0 0 2px {{r.color}}"></span>
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">{{r.label}}</span><span style="font-size: 12px; color: #B9B5D6">{{r.where}}</span></span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 14px">
      <button onClick="{{toggleLink}}" aria-pressed="{{linkedOn}}" style="flex: 1; height: 60px; border-radius: 16px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left"><span style="width: 48px; height: 28px; border-radius: 14px; background: {{linkTrack}}; position: relative; flex-shrink: 0"><span style="position: absolute; left: {{linkKnob}}px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Same spot for all</span><span style="font-size: 12px; color: #B9B5D6">{{linkSub}}</span></span></button>
      <div style="display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(2, 28px); gap: 4px">
        <span></span><button onClick="{{up}}" aria-label="Move up" style="border: none; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; padding: 0">▲</button><span></span>
        <button onClick="{{left}}" aria-label="Move left" style="border: none; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; padding: 0">◀</button><button onClick="{{down}}" aria-label="Move down" style="border: none; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; padding: 0">▼</button><button onClick="{{right}}" aria-label="Move right" style="border: none; border-radius: 8px; background: rgba(255,255,255,0.14); color: #FFFFFF; padding: 0">▶</button>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'all', linked: false, c: { full: [262, 350], square: [250, 255], wide: [262, 300], ipad: [262, 360] } }; }
  renderVals() {
    const W = 525, H = 700;
    const S = {
      full: ['Full screen', 'Phone detail', 323, 700, '30px', '#FFFFFF'],
      square: ['Card', 'Home and small widget', 270, 270, '26px', '#F7BC33'],
      wide: ['Wide widget', 'Home Screen', 490, 230, '24px', '#66B6FE'],
      ipad: ['iPad', 'Split view and wall', 480, 336, '20px', '#83C236']
    };
    const s = this.state, clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const box = (k) => { const w = S[k][2], h = S[k][3]; return { x: clamp(s.c[k][0] - w / 2, 0, W - w), y: clamp(s.c[k][1] - h / 2, 0, H - h), w, h }; };
    const order = ['full', 'ipad', 'wide', 'square'].filter((k) => k !== s.sel).concat(s.sel === 'all' ? [] : [s.sel]);
    const frames = order.map((k) => { const sel = s.sel === k; return { ...box(k), label: S[k][0], radius: S[k][4], color: S[k][5], border: (sel ? '3px solid ' : '2px dashed ') + S[k][5], mask: sel ? '0 0 0 999px rgba(18,15,34,0.6)' : 'none', op: s.sel === 'all' || sel ? '1' : '0.3' }; });
    const rows = Object.keys(S).map((k) => {
      const b = box(k), kk = 84 / b.h, on = s.sel === k;
      return { label: S[k][0], where: S[k][1], color: S[k][5], mw: Math.round(b.w * kk), mr: k === 'full' ? '10px' : '12px', px: -Math.round(b.x * kk), py: -Math.round(b.y * kk), bw: Math.round(W * kk), bh: Math.round(H * kk), on: on ? 'true' : 'false', ring: on ? S[k][5] : 'transparent', bg: on ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.06)', pick: () => this.setState({ sel: k }) };
    });
    const move = (dx, dy) => () => {
      const keys = s.linked || s.sel === 'all' ? Object.keys(S) : [s.sel], c = { ...s.c };
      keys.forEach((k) => { const w = S[k][2], h = S[k][3]; c[k] = [clamp(c[k][0] + dx, w / 2, W - w / 2), clamp(c[k][1] + dy, h / 2, H - h / 2)]; });
      this.setState({ c });
    };
    return {
      frames, rows,
      showAll: () => this.setState({ sel: 'all' }), allOn: s.sel === 'all' ? 'true' : 'false', allRing: s.sel === 'all' ? '#FFFFFF' : 'transparent',
      hint: s.sel === 'all' ? 'All 4 shapes this photo fills' : 'Drag the photo to set the ' + S[s.sel][0].toLowerCase() + ' crop',
      linkedOn: s.linked ? 'true' : 'false', linkTrack: s.linked ? '#1B998B' : 'rgba(255,255,255,0.25)', linkKnob: s.linked ? 23 : 3,
      linkSub: s.linked ? 'Moving one moves them all' : 'Each shape keeps its own crop',
      toggleLink: () => this.setState({ linked: !s.linked, c: !s.linked ? { full: [s.c.full[0], 350], square: [s.c.full[0], 350], wide: [s.c.full[0], 350], ipad: [s.c.full[0], 350] } : s.c }),
      up: move(0, -20), down: move(0, 20), left: move(-20, 0), right: move(20, 0)
    };
  }
}
</script>
</body>
</html>
