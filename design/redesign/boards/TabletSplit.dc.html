<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdowns split view, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0D67}a:hover{color:#1C1633}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; overflow: hidden; background: #F5F4FF; color: #1C1633; font-family: Inter, system-ui, sans-serif; display: flex">
  <aside style="width: 232px; flex-shrink: 0; padding: 32px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; background: #ECEAFB">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; padding: 0 10px 18px">Countdowns</span>
    <button style="height: 44px; border: none; border-radius: 12px; background: #1C1633; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span style="flex: 1; text-align: left">Upcoming</span><span>5</span></button>
    <button style="height: 44px; border: none; border-radius: 12px; background: transparent; color: #1C1633; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg><span style="flex: 1; text-align: left">Done</span><span style="color: #5E5878">1</span></button>
    <button style="height: 44px; border: none; border-radius: 12px; background: transparent; color: #1C1633; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg><span style="flex: 1; text-align: left">Wall mode</span></button>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <a href="TabletSettings.dc.html" style="height: 44px; border-radius: 12px; background: transparent; color: #1C1633; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg><span style="flex: 1; text-align: left">Settings</span></a>
    </div>
  </aside>

  <section aria-label="Countdowns" style="width: 372px; flex-shrink: 0; padding: 32px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; position: relative">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">Upcoming</h1>
      <a href="TabletEditor.dc.html" aria-label="New countdown" style="width: 44px; height: 44px; border-radius: 22px; background: #4A0D67; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>
    <sc-for list="{{list}}" as="ev" hint-placeholder-count="5">
      <button onClick="{{ev.pick}}" aria-pressed="{{ev.on}}" style="height: 104px; border-radius: 22px; border: 3px solid {{ev.ring}}; background: {{ev.color}}; color: #1C1633; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; text-align: left">
        <span style="width: 44px; height: 44px; border-radius: 16px; background: rgba(28,22,51,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ev.icon}}"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-family: {{ev.font}}; font-size: 18px; font-weight: 700">{{ev.title}}</span><span style="font-size: 13px; font-weight: 600">{{ev.date}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 38px; font-weight: 800; line-height: 1">{{ev.days}}</span><span style="font-size: 12px; font-weight: 700">days</span></span>
      </button>
    </sc-for>
  </section>

  <main style="flex: 1; margin: 16px 16px 16px 0; border-radius: 32px; background: {{sel.color}}; color: #1C1633; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; min-width: 0">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="width: 60px; height: 60px; border-radius: 22px; background: rgba(28,22,51,0.12); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{sel.icon}}"></path></svg></span>
      <div style="display: flex; gap: 8px">
        <button aria-label="Share" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(28,22,51,0.12); color: #1C1633; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
        <a href="TabletEditor.dc.html" style="height: 44px; padding: 0 20px; border-radius: 22px; background: #1C1633; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-weight: 700; font-size: 15px">Edit</a>
      </div>
    </div>
    <h2 style="margin: 28px 0 6px; font-family: {{sel.font}}; font-size: 48px; font-weight: 700; line-height: 1.05">{{sel.title}}</h2>
    <span style="font-size: 17px; font-weight: 600">{{sel.long}}</span>
    <div style="margin-top: auto; display: flex; align-items: flex-end; gap: 14px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 220px; font-weight: 800; line-height: 0.8; letter-spacing: -0.05em">{{sel.days}}</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; padding-bottom: 8px">days</span>
    </div>
    <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: #1C1633; color: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800">{{sel.h}}</span><span style="font-size: 13px; font-weight: 600; color: #CFCBE6">hours</span></div>
      <div style="background: #1C1633; color: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800">{{sel.m}}</span><span style="font-size: 13px; font-weight: 600; color: #CFCBE6">minutes</span></div>
      <div style="background: #1C1633; color: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800">{{sel.s}}</span><span style="font-size: 13px; font-weight: 600; color: #CFCBE6">seconds</span></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 1 }; }
  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const I = {
      dining: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7',
      gift: 'M4 8h16v4H4zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5',
      spark: 'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z',
      cake: 'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3',
      plane: 'M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z'
    };
    const ev = [
      ['Thanksgiving', new Date(2026, 10, 26), '#FE7228', 'dining', "'Bricolage Grotesque', sans-serif", true],
      ['Christmas', new Date(2026, 11, 25), '#FF564A', 'gift', "'Libre Baskerville', serif", true],
      ['New Year’s Eve', new Date(2026, 11, 31, 20), '#F7BC33', 'spark', "'Bricolage Grotesque', sans-serif", false],
      ['Mia’s birthday', new Date(2027, 1, 3), '#FE607C', 'cake', "'Comic Neue', cursive", true],
      ['Japan trip', new Date(2027, 2, 14, 9, 30), '#66B6FE', 'plane', "'Bricolage Grotesque', sans-serif", false]
    ];
    const now = Date.now();
    const pad = (n) => String(n).padStart(2, '0');
    const list = ev.map(([title, d, color, icon, font, allDay], i) => {
      const ms = Math.max(d.getTime() - now, 0);
      const on = this.state.sel === i;
      const time = allDay ? 'All day' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      return {
        title, color, font, icon: I[icon], on: on ? 'true' : 'false', ring: on ? '#1C1633' : 'transparent',
        days: Math.floor(ms / 864e5),
        date: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
        long: d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + ' · ' + time,
        h: pad(Math.floor(ms / 36e5) % 24), m: pad(Math.floor(ms / 6e4) % 60), s: pad(Math.floor(ms / 1e3) % 60),
        pick: () => this.setState({ sel: i })
      };
    });
    return { list, sel: list[this.state.sel] };
  }
}
</script>
</body>
</html>
