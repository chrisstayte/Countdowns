<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0D67}a:hover{color:#1C1633}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F4FF; color: #1C1633; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 58px 16px 12px; display: flex; align-items: center; gap: 10px">
    <div role="search" style="flex: 1; height: 46px; border-radius: 23px; background: #FFFFFF; border: 2px solid #4A0D67; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5878" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="flex: 1; font-size: 16px; color: {{fieldInk}}">{{fieldText}}<span aria-hidden="true" style="display: inline-block; width: 2px; height: 18px; background: #4A0D67; vertical-align: -3px; margin-left: 1px"></span></span>
      <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}">
        <button onClick="{{clear}}" aria-label="Clear search" style="width: 24px; height: 24px; border-radius: 12px; border: none; background: #D6D3F0; color: #1C1633; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </sc-if>
    </div>
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 600; font-size: 16px; color: #4A0D67; text-decoration: none">Cancel</a>
  </header>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{true}}">
    <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 24px">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Recent</h2>
          <button style="border: none; background: none; padding: 0; font-size: 13px; font-weight: 600; color: #4A0D67">Clear</button>
        </div>
        <div style="background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
          <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
            <button onClick="{{r.pick}}" style="height: 48px; border: none; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #1C1633; border-top: {{r.line}}; text-align: left"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8796" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2"></path><circle cx="12" cy="12" r="9"></circle></svg><span style="flex: 1">{{r.label}}</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8796" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"></path></svg></button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Coming up</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{whens}}" as="w" hint-placeholder-count="4">
            <button onClick="{{w.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1.5px solid #D6D3F0; background: #FFFFFF; color: #1C1633; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{w.label}}<span style="font-size: 12px; font-weight: 700; color: #5E5878">{{w.count}}</span></button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">By icon</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
            <button onClick="{{k.pick}}" style="border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #1C1633"><span style="width: 56px; height: 56px; border-radius: 18px; background: {{k.color}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1633" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icon}}"></path></svg></span>{{k.label}}</button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Try adding</h2>
        <div style="display: flex; gap: 10px">
          <a href="PhoneEditor.dc.html" style="flex: 1; height: 64px; border-radius: 18px; background: #FFFFFF; text-decoration: none; color: #1C1633; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-weight: 700; font-size: 15px">Valentine's Day</span><span style="font-size: 12px; color: #5E5878">Sun, Feb 14</span></a>
          <a href="PhoneEditor.dc.html" style="flex: 1; height: 64px; border-radius: 18px; background: #FFFFFF; text-decoration: none; color: #1C1633; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-weight: 700; font-size: 15px">Easter</span><span style="font-size: 12px; color: #5E5878">Sun, Mar 28</span></a>
        </div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}">
    <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5878">{{summary}}</span>
      <sc-for list="{{results}}" as="ev" hint-placeholder-count="3">
        <a href="PhoneDetail.dc.html" style="text-decoration: none; color: #1C1633; background: #FFFFFF; border-radius: 20px; padding: 10px 14px 10px 10px; display: flex; align-items: center; gap: 12px; opacity: {{ev.fade}}">
          <span style="width: 56px; height: 56px; border-radius: 16px; background: {{ev.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; line-height: 1">{{ev.big}}</span><span style="font-size: 10px; font-weight: 700">{{ev.unit}}</span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-family: {{ev.font}}; font-size: 17px; font-weight: 600">{{ev.pre}}<mark style="background: #F7BC33; color: #1C1633; border-radius: 4px; padding: 0 1px">{{ev.hit}}</mark>{{ev.post}}</span><span style="font-size: 13px; color: #5E5878">{{ev.date}}</span></span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8796" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">Nothing called "{{query}}"</span>
          <span style="font-size: 14px; color: #5E5878">Want to count down to it?</span>
          <a href="PhoneEditor.dc.html" style="height: 48px; padding: 0 22px; border-radius: 24px; background: #4A0D67; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-weight: 700">New countdown "{{query}}"</a>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"query":{"editor":"enum","options":["","trip","bir","Dec","done","Halloween"],"default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { query: p.query || '' }; }
  renderVals() {
    const I = {
      dining: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7',
      gift: 'M4 8h16v4H4zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5',
      spark: 'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z',
      cake: 'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3',
      plane: 'M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z',
      home: 'M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'
    };
    const now = Date.now();
    const fmt = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    const E = [
      ['Thanksgiving', new Date(2026, 10, 26), '#FE7228', "'Bricolage Grotesque', sans-serif", 'dining', 'Thanksgiving Nov holiday'],
      ['Christmas', new Date(2026, 11, 25), '#FF564A', "'Libre Baskerville', serif", 'gift', 'Christmas Dec holiday'],
      ['New Year’s Eve', new Date(2026, 11, 31, 20), '#F7BC33', "'Bricolage Grotesque', sans-serif", 'spark', 'New Year Dec party'],
      ['Mia’s birthday', new Date(2027, 1, 3), '#FE607C', "'Comic Neue', cursive", 'cake', 'Mia birthday Feb 2027'],
      ['Japan trip', new Date(2027, 2, 14, 9, 30), '#66B6FE', "'Bricolage Grotesque', sans-serif", 'plane', 'Japan trip Mar travel 2027'],
      ['Road trip to Maine', new Date(2026, 6, 4), '#83C236', "'Bricolage Grotesque', sans-serif", 'plane', 'Road trip Maine Jul travel done'],
      ['Moved in', new Date(2026, 7, 2), '#83C236', "'Bricolage Grotesque', sans-serif", 'home', 'Moved in Aug home done']
    ];
    const s = this.state, q = s.query.trim(), ql = q.toLowerCase();
    const set = (v) => () => this.setState({ query: v });
    const hits = q ? E.filter((e) => e[5].toLowerCase().includes(ql)) : [];
    const results = hits.sort((a, b) => (a[1] < now) - (b[1] < now) || a[1] - b[1]).map(([title, d, color, font, icon]) => {
      const past = d.getTime() < now;
      const days = Math.floor(Math.abs(d.getTime() - now) / 864e5);
      const i = title.toLowerCase().indexOf(ql);
      const pre = i >= 0 ? title.slice(0, i) : title, hit = i >= 0 ? title.slice(i, i + q.length) : '', post = i >= 0 ? title.slice(i + q.length) : '';
      return { color: past ? '#E4E1F5' : color, font, pre, hit, post, big: String(days), unit: past ? 'days ago' : 'days', date: (past ? 'Done · ' : '') + fmt(d), fade: past ? '0.75' : '1' };
    });
    const up = results.filter((r) => r.unit === 'days').length, done = results.length - up;
    return {
      query: q,
      isEmpty: !q, hasQuery: !!q, noResults: !!q && results.length === 0,
      fieldText: q || 'Search countdowns', fieldInk: q ? '#1C1633' : '#8A8796',
      clear: set(''),
      recents: ['Japan', 'birthday', 'Dec'].map((label, n) => ({ label, line: n ? '1px solid #EEECF8' : 'none', pick: set(label === 'birthday' ? 'bir' : label) })),
      whens: [['This week', '1', 'Thanksgiving'], ['December', '2', 'Dec'], ['2027', '2', '2027'], ['Done', '2', 'done']].map(([label, count, v]) => ({ label, count, pick: set(v) })),
      kinds: [['Holidays', '#FE7228', 'dining', 'holiday'], ['Gifts', '#FF564A', 'gift', 'Christmas'], ['Birthdays', '#FE607C', 'cake', 'bir'], ['Trips', '#66B6FE', 'plane', 'trip'], ['Parties', '#F7BC33', 'spark', 'party']].map(([label, color, icon, v]) => ({ label, color, icon: I[icon], pick: set(v) })),
      results,
      summary: results.length ? (up + ' upcoming' + (done ? ' · ' + done + ' done' : '')) : ''
    };
  }
}
</script>
</body>
</html>
