<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Detail in every unit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1633}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1680px; height: 844px; display: flex; gap: 40px; background: transparent">
  <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; flex-shrink: 0"><dc-import name="PhoneDetail" unit="days" hint-size="390px,844px"></dc-import></div>
  <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; flex-shrink: 0"><dc-import name="PhoneDetail" unit="weeks" hint-size="390px,844px"></dc-import></div>
  <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; flex-shrink: 0"><dc-import name="PhoneDetail" unit="sleeps" hint-size="390px,844px"></dc-import></div>
  <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; flex-shrink: 0"><dc-import name="PhoneDetail" unit="hours" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
