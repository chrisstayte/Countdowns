<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdowns wall mode, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B3B2F7}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; overflow: hidden; background: #120F22; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums">{{clock}}</span>
      <span style="font-size: 17px; font-weight: 600; color: #B9B5D6">{{today}}</span>
    </div>
    <a href="TabletSplit.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(255,255,255,0.1); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Exit wall mode</a>
  </header>
  <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; min-height: 0">
    <div style="grid-column: span 2; grid-row: span 2; border-radius: 36px; background: {{hero.color}}; color: #1C1633; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Up next</span>
      <span style="margin-top: 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700">{{hero.title}}</span>
      <span style="font-size: 17px; font-weight: 600">{{hero.date}}</span>
      <div style="margin-top: auto; display: flex; align-items: flex-end; gap: 12px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 200px; font-weight: 800; line-height: 0.8; letter-spacing: -0.05em">{{hero.days}}</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 700; padding-bottom: 6px">days</span>
      </div>
      <span style="margin-top: 18px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums">{{hero.hms}}</span>
    </div>
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
      <div style="border-radius: 28px; background: {{t.color}}; color: #1C1633; padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; min-height: 0">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <span style="font-family: {{t.font}}; font-size: 22px; font-weight: 700; line-height: 1.15">{{t.title}}</span>
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{t.icon}}"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 72px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em">{{t.days}}</span><span style="font-size: 18px; font-weight: 700">days</span></div>
          <span style="font-size: 14px; font-weight: 600">{{t.date}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const I = {
      gift: 'M4 8h16v4H4zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5',
      spark: 'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z',
      cake: 'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3',
      plane: 'M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z'
    };
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const left = (d) => Math.max(d.getTime() - now.getTime(), 0);
    const hd = new Date(2026, 10, 26);
    const hms = left(hd);
    const tiles = [
      ['Christmas', new Date(2026, 11, 25), '#FF564A', 'gift', "'Libre Baskerville', serif"],
      ['New Year’s Eve', new Date(2026, 11, 31, 20), '#F7BC33', 'spark', "'Bricolage Grotesque', sans-serif"],
      ['Mia’s birthday', new Date(2027, 1, 3), '#FE607C', 'cake', "'Comic Neue', cursive"],
      ['Japan trip', new Date(2027, 2, 14, 9, 30), '#66B6FE', 'plane', "'Bricolage Grotesque', sans-serif"]
    ].map(([title, d, color, icon, font]) => ({ title, color, font, icon: I[icon], days: Math.floor(left(d) / 864e5), date: fmt(d) }));
    return {
      clock: now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
      today: now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
      hero: { title: 'Thanksgiving', color: '#FE7228', date: 'Thursday, November 26', days: Math.floor(hms / 864e5), hms: pad(Math.floor(hms / 36e5) % 24) + ' : ' + pad(Math.floor(hms / 6e4) % 60) + ' : ' + pad(Math.floor(hms / 1e3) % 60) },
      tiles
    };
  }
}
</script>
</body>
</html>
