<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown editor studio, tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;family=Roboto:wght@400;700&amp;family=Luxurious+Roman&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0D67}a:hover{color:#1C1633}
button{font:inherit;cursor:pointer}
input{font:inherit}
@font-face{font-family:'CarnivaleeFreakshow';src:url(/_blob/b5692f0f7701c2b3c3a3b87689f0eb8b)}
@font-face{font-family:'DiarioDeAndy';src:url(/_blob/a0f4bcd96836b633ffd19744c8d1170b)}
@font-face{font-family:'GoodTimes';src:url(/_blob/892158b16779b47856d11b66141f02ad)}
@font-face{font-family:'NewWaltDisney';src:url(/_blob/cb2417967e8d87c41d188f7075ea6ab5)}
@font-face{font-family:'Starjedi';src:url(/_blob/016d6673ab73ace54286b8565f4c1b4b)}
@font-face{font-family:'Sunnyspells';src:url(/_blob/d4374ef08c1bff95db3ad13f895887b6)}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; overflow: hidden; background: #ECEAFB; color: #1C1633; font-family: Inter, system-ui, sans-serif; display: flex">
  <section aria-label="Preview" style="flex: 1; padding: 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; min-width: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="TabletSplit.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 600; font-size: 16px; color: #4A0D67; text-decoration: none">Cancel</a>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Live preview</span>
      <span style="width: 60px"></span>
    </div>
    <div style="flex: 1; display: flex; gap: 32px; align-items: center; justify-content: center">
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
        <div style="width: 200px; height: 200px; border-radius: 28px; background: {{color}}; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 14px 30px rgba(28,22,51,0.16)">
          <div style="display: flex; justify-content: space-between; align-items: flex-start"><span style="font-family: {{font}}; font-size: 20px; font-weight: 700">Japan trip</span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z"></path></svg></div>
          <div><div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 800; line-height: 0.9">113</span><span style="font-size: 16px; font-weight: 700">days</span></div><span style="font-size: 12px; font-weight: 600">Sun, Mar 14</span></div>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #5E5878">Card</span>
        <div style="width: 200px; height: 94px; border-radius: 24px; background: {{color}}; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
          <span style="font-family: {{font}}; font-size: 16px; font-weight: 700">Japan trip</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1">113 <span style="font-size: 14px">days</span></span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #5E5878">Widget</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
        <div style="width: 300px; height: 560px; border-radius: 40px; border: 8px solid #1C1633; background: {{color}}; padding: 40px 22px 26px; box-sizing: border-box; display: flex; flex-direction: column">
          <span style="width: 44px; height: 44px; border-radius: 16px; background: rgba(28,22,51,0.12); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z"></path></svg></span>
          <span style="margin-top: 14px; font-family: {{font}}; font-size: 32px; font-weight: 700">Japan trip</span>
          <span style="font-size: 13px; font-weight: 600">Sunday, March 14 · 9:30 AM</span>
          <span style="margin-top: auto; font-family: 'Bricolage Grotesque', sans-serif; font-size: 120px; font-weight: 800; line-height: 0.8; letter-spacing: -0.05em">113</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; padding-left: 4px">days to go</span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #5E5878">Full screen</span>
      </div>
    </div>
  </section>

  <aside aria-label="Options" style="width: 440px; flex-shrink: 0; background: #FFFFFF; border-radius: 32px 0 0 32px; padding: 28px 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">New countdown</h1>
      <a href="TabletSplit.dc.html" style="height: 44px; padding: 0 22px; border-radius: 22px; background: #1B998B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-weight: 700; font-size: 15px">Save</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2"><label for="tname" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Name</label><input id="tname" value="Japan trip" style="height: 48px; border-radius: 14px; border: 1.5px solid #D6D3F0; padding: 0 14px; font-size: 16px; color: #1C1633; background: #F5F4FF"></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Date</span><button style="height: 48px; border-radius: 14px; border: 1.5px solid #D6D3F0; background: #F5F4FF; text-align: left; padding: 0 14px; font-size: 16px; color: #1C1633">Mar 14, 2027</button></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Time</span><button style="height: 48px; border-radius: 14px; border: 1.5px solid #D6D3F0; background: #F5F4FF; text-align: left; padding: 0 14px; font-size: 16px; color: #1C1633">9:30 AM</button></div>
    </div>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Colour</h2>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="12">
          <button onClick="{{sw.pick}}" aria-label="{{sw.name}}" aria-pressed="{{sw.on}}" style="height: 44px; border-radius: 22px; border: 3px solid {{sw.ring}}; background: {{sw.c}}; box-shadow: inset 0 0 0 3px #FFFFFF"></button>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Font</h2>
        <nav aria-label="Jump to font group" style="display: flex; gap: 4px; background: #F5F4FF; border-radius: 18px; padding: 3px">
          <a href="#fonts-clean" style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #1C1633; text-decoration: none">Clean</a>
          <a href="#fonts-classic" style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #1C1633; text-decoration: none">Classic</a>
          <a href="#fonts-fun" style="height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #1C1633; text-decoration: none">Fun</a>
        </nav>
      </div>
      <div style="height: 206px; overflow-y: auto; border-radius: 18px; background: #F5F4FF; padding: 0 10px 10px; box-sizing: border-box; position: relative">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div id="{{g.id}}" style="position: sticky; top: 0; z-index: 1; background: #F5F4FF; padding: 10px 4px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">{{g.label}}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{g.fonts}}" as="f" hint-placeholder-count="3">
              <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 54px; border-radius: 14px; border: 2px solid {{f.border}}; background: #FFFFFF; color: #1C1633; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left; min-width: 0"><span style="font-family: {{f.family}}; font-size: 19px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">Japan trip</span><span style="font-size: 10px; font-weight: 600; color: #5E5878">{{f.name}}</span></button>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Remind me</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #1C1633; color: #FFFFFF; font-size: 14px; font-weight: 600">On the day</button>
        <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #1C1633; color: #FFFFFF; font-size: 14px; font-weight: 600">1 week before</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D6D3F0; background: transparent; color: #1C1633; font-size: 14px; font-weight: 600">1 day before</button>
      </div>
    </section>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { color: '#66B6FE', font: 'Default' }; }
  renderVals() {
    const C = [['Lavender','#7877E6'],['Charcoal','#8A8796'],['Sun','#F7BC33'],['Tomato','#FF564A'],['Peach','#FEA08B'],['Tangerine','#FE7228'],['Lime','#83C236'],['Cobalt','#597FFE'],['Sky','#66B6FE'],['Bubblegum','#FE607C'],['Mint','#5FD3B5'],['Lilac','#C9A7F5']];
    const F = [['Default', "'Bricolage Grotesque', sans-serif", 'Clean'], ['Roboto', 'Roboto, sans-serif', 'Clean'], ['Good Times', "'GoodTimes', sans-serif", 'Clean'], ['Baskerville', "'Libre Baskerville', serif", 'Classic'], ['Luxurious Roman', "'Luxurious Roman', serif", 'Classic'], ['Comic Neue', "'Comic Neue', cursive", 'Fun'], ['Diario De Andy', "'DiarioDeAndy', cursive", 'Fun'], ['Sunnyspells', "'Sunnyspells', cursive", 'Fun'], ['Carnivalee Freakshow', "'CarnivaleeFreakshow', fantasy", 'Fun'], ['Not Starwars', "'Starjedi', fantasy", 'Fun'], ['Not Disney', "'NewWaltDisney', fantasy", 'Fun']];
    const s = this.state;
    return {
      color: s.color,
      font: (F.find((f) => f[0] === s.font) || F[0])[1],
      swatches: C.map(([name, c]) => ({ name, c, on: s.color === c ? 'true' : 'false', ring: s.color === c ? '#1C1633' : 'transparent', pick: () => this.setState({ color: c }) })),
      groups: ['Clean', 'Classic', 'Fun'].map((label) => ({ label, id: 'fonts-' + label.toLowerCase(), fonts: F.filter((f) => f[2] === label).map(([name, family]) => ({ name, family, on: s.font === name ? 'true' : 'false', border: s.font === name ? '#1C1633' : 'transparent', pick: () => this.setState({ font: name }) })) }))
    };
  }
}
</script>
</body>
</html>
