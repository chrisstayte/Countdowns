<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style picker, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:wght@400;700&amp;family=Comic+Neue:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0D67}a:hover{color:#1C1633}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F4FF; color: #1C1633; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 54px 16px 10px; display: flex; align-items: center; justify-content: space-between">
    <a href="PhoneEditor.dc.html" style="height: 44px; padding: 0 6px; display: flex; align-items: center; font-weight: 600; font-size: 16px; color: #4A0D67; text-decoration: none">Cancel</a>
    <span style="font-weight: 700; font-size: 17px">Look</span>
    <a href="PhotoHome.dc.html" style="height: 40px; padding: 0 18px; border-radius: 20px; background: #1C1633; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-weight: 700; font-size: 15px">Done</a>
  </header>

  <div style="padding: 6px 20px 16px">
    <div style="background: {{cardBg}}; color: {{ink}}; border-radius: 24px; height: 176px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 14px 30px rgba(28,22,51,0.18); position: relative">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; text-shadow: {{shadow}}">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700">Japan trip</span>
        <sc-if value="{{hasIcon}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{iconPath}}"></path></svg></sc-if>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; text-shadow: {{shadow}}">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 60px; font-weight: 800; line-height: 0.9; letter-spacing: -0.03em">113</span>
        <span style="font-size: 18px; font-weight: 700">days</span>
      </div>
      <sc-if value="{{isPhoto}}" hint-placeholder-val="{{false}}">
        <a href="PhotoCrop.dc.html" style="position: absolute; right: 14px; bottom: 14px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.9); color: #1C1633; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-shadow: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 2v16h16M2 6h16v16"></path></svg>Crop</a>
      </sc-if>
    </div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 20px 20px 30px; display: flex; flex-direction: column; gap: 20px">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Background</h2><span style="font-size: 12px; font-weight: 600; color: #5E5878">Photo, colour or gradient</span></div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <a href="PhotoCrop.dc.html" aria-label="Add a photo" style="height: 46px; border-radius: 14px; border: 1.5px dashed #4A0D67; background: #F5F4FF; color: #4A0D67; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg></a>
        <sc-for list="{{bgs}}" as="b" hint-placeholder-count="17">
          <button onClick="{{b.pick}}" aria-label="{{b.name}}" aria-pressed="{{b.on}}" style="height: 46px; border-radius: {{b.radius}}; border: 3px solid {{b.ring}}; background: {{b.fill}}; box-shadow: inset 0 0 0 3px #FFFFFF; padding: 0"></button>
        </sc-for>
      </div>
    </section>

    <sc-if value="{{isPhoto}}" hint-placeholder-val="{{false}}">
      <section style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878; width: 64px">Darken</span>
        <div style="flex: 1; display: flex; gap: 6px">
          <sc-for list="{{dims}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="flex: 1; height: 36px; border-radius: 18px; border: 1.5px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 13px; font-weight: 600">{{d.label}}</button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5E5878">Icon</h2><span style="font-size: 12px; font-weight: 600; color: #5E5878">Optional</span></div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{icons}}" as="ic" hint-placeholder-count="12">
          <button onClick="{{ic.pick}}" aria-label="{{ic.name}}" aria-pressed="{{ic.on}}" style="height: 46px; border-radius: 14px; border: none; background: {{ic.bg}}; color: {{ic.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.d}}"></path></svg></button>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { bg: 'fuji', icon: 'plane', dim: 'Medium' }; }
  renderVals() {
    const PH = { fuji: '/_blob/936f0c7563d452e48e8a01312dd864ba', beach: '/_blob/176363716b4c903c7c79827e2038e0ec' };
    const C = [['Lavender','#7877E6'],['Charcoal','#8A8796'],['Sun','#F7BC33'],['Tomato','#FF564A'],['Peach','#FEA08B'],['Tangerine','#FE7228'],['Lime','#83C236'],['Cobalt','#597FFE'],['Sky','#66B6FE'],['Bubblegum','#FE607C'],['Mint','#5FD3B5'],['Lilac','#C9A7F5']];
    const G = [['Sunset','linear-gradient(135deg, #FE7228, #FE607C)'],['Lagoon','linear-gradient(135deg, #66B6FE, #5FD3B5)'],['Grape','linear-gradient(135deg, #7877E6, #C9A7F5)']];
    const I = {
      none: 'M5 19L19 5', plane: 'M2 16l20-7-3-3-8 3-5-3-2 1 4 4-4 2-2-1-1 1 3 3z',
      gift: 'M4 8h16v4H4zM12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5',
      cake: 'M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3',
      spark: 'M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z',
      heart: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z',
      cap: 'M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',
      home: 'M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      dining: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7',
      ring: 'M8 8l4-5 4 5M12 21a6 6 0 1 0 0-12 6 6 0 0 0 0 12z',
      baby: 'M9 12h.01M15 12h.01M10 16c1 .7 3 .7 4 0M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3c-1 2 0 3 2 3',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'
    };
    const D = { Light: 0.15, Medium: 0.35, Strong: 0.55 };
    const s = this.state, isPhoto = !!PH[s.bg];
    const all = [['fuji', 'Japan photo', 'url(' + PH.fuji + ') center/cover', '14px'], ['beach', 'Beach photo', 'url(' + PH.beach + ') center/cover', '14px']]
      .concat(G.map(([n, g]) => [n, n, g, '23px'])).concat(C.map(([n, c]) => [n, n, c, '23px']));
    const cur = all.find((x) => x[0] === s.bg);
    const a = D[s.dim];
    return {
      isPhoto, hasIcon: s.icon !== 'none', iconPath: I[s.icon],
      cardBg: isPhoto ? 'linear-gradient(rgba(18,15,34,' + a + '), rgba(18,15,34,' + (a + 0.15) + ')), url(' + PH[s.bg] + ') center/cover' : cur[2],
      ink: isPhoto ? '#FFFFFF' : '#1C1633', shadow: isPhoto ? '0 1px 8px rgba(0,0,0,0.35)' : 'none',
      bgs: all.map(([k, name, fill, radius]) => ({ name, fill, radius, on: s.bg === k ? 'true' : 'false', ring: s.bg === k ? '#1C1633' : 'transparent', pick: () => this.setState({ bg: k }) })),
      dims: Object.keys(D).map((label) => ({ label, on: s.dim === label ? 'true' : 'false', bg: s.dim === label ? '#1C1633' : 'transparent', fg: s.dim === label ? '#FFFFFF' : '#1C1633', border: s.dim === label ? '#1C1633' : '#D6D3F0', pick: () => this.setState({ dim: label }) })),
      icons: Object.keys(I).map((k) => ({ name: k === 'none' ? 'No icon' : k, d: I[k], on: s.icon === k ? 'true' : 'false', bg: s.icon === k ? '#1C1633' : '#F5F4FF', fg: s.icon === k ? '#FFFFFF' : '#1C1633', pick: () => this.setState({ icon: k }) }))
    };
  }
}
</script>
</body>
</html>
