plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
   def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
   }

def uploadKeystore = System.getenv('ANDROID_UPLOAD_KEYSTORE')

android {
    namespace "com.chrisstayte.countdowns"
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.chrisstayte.countdowns"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
       release {
           keyAlias uploadKeystore ? System.getenv('ANDROID_KEY_ALIAS') : keystoreProperties['keyAlias']
           keyPassword uploadKeystore ? System.getenv('ANDROID_KEY_PASSWORD') : keystoreProperties['keyPassword']
           storeFile uploadKeystore ? file(uploadKeystore) : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
           storePassword uploadKeystore ? System.getenv('ANDROID_STORE_PASSWORD') : keystoreProperties['storePassword']
       }
   }

    buildTypes {
        
        release {
            // Signed when key.properties is present; otherwise an unsigned
            // release build (for checking R8 and the release config locally).
            signingConfig = (uploadKeystore || keystorePropertiesFile.exists()) ? signingConfigs.release : null
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
    // Home screen widgets: our own Glance code, no Flutter widget package.
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (Android's is a stub there).
    testImplementation 'org.json:json:20250517'
}
