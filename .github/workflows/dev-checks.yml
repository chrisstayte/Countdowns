name: Dev checks
on:
  workflow_call:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        run: |
          sdk="$RUNNER_TEMP/flutter"
          tag=refs/tags/3.50.1
          revision=ae9b586f34a8443573f82ef57c3bf914a908cbf7
          git init --quiet "$sdk"
          git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk" fetch --depth=1 --no-tags origin "$tag:$tag"
          test "$(git -C "$sdk" rev-parse "$tag^{commit}")" = "$revision"
          git -C "$sdk" checkout --quiet --detach "$revision"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - id: dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test
